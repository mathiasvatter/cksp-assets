name: Build And Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'scripts/generate-index.sh'
      - 'scripts/build-video.sh'
      - '.github/workflows/generate-index.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Die abgeleiteten Dateien werden nicht versioniert, sondern gecacht. Der
      # Key haengt an den Quell-Inhalten: aendert sich einer, greifen die
      # restore-keys und build-video.sh baut per SHA-Vergleich nur das Neue.
      # hashFiles laeuft vor dem Restore, sieht also nur die Quellen.
      - name: Restore converted videos
        uses: actions/cache@v4
        with:
          path: assets/video
          key: gif-mp4-v1-${{ hashFiles('assets/**/*.gif', 'assets/**/*.mp4') }}
          restore-keys: |
            gif-mp4-v1-

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Build derived video assets
        run: bash scripts/build-video.sh

      - name: Generate index.html
        run: bash scripts/generate-index.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
