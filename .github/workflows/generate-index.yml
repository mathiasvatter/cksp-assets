name: Build And Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'scripts/generate-index.sh'
      - 'scripts/convert-gifs.sh'
      - '.github/workflows/generate-index.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Die MP4s werden nicht versioniert, sondern gecacht. Der Key haengt an
      # den GIF-Inhalten: aendert sich eines, greifen die restore-keys und
      # convert-gifs.sh encodiert per SHA-Vergleich nur das neue GIF neu.
      - name: Restore converted videos
        uses: actions/cache@v4
        with:
          path: assets/video
          key: gif-mp4-v1-${{ hashFiles('assets/**/*.gif') }}
          restore-keys: |
            gif-mp4-v1-

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Convert GIFs to MP4
        run: bash scripts/convert-gifs.sh

      - name: Generate index.html
        run: bash scripts/generate-index.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
